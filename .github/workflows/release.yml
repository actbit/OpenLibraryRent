name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OpenLibraryRent/OpenLibraryRent.Client/package-lock.json

      - name: Install npm dependencies
        working-directory: OpenLibraryRent/OpenLibraryRent.Client
        run: npm ci

      - name: Build frontend
        working-directory: OpenLibraryRent/OpenLibraryRent.Client
        run: npm run build

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Publish
        run: dotnet publish OpenLibraryRent/OpenLibraryRent.csproj --configuration Release --output ./publish

      - name: Create version tag
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d')-${{ github.run_number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create ZIP archive
        run: |
          cd publish
          zip -r ../OpenLibraryRent-${{ steps.version.outputs.version }}.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## OpenLibraryRent Release v${{ steps.version.outputs.version }}

            **Changes:**
            ${{ github.event.head_commit.message }}

            **Commit:** ${{ github.sha }}
          files: |
            OpenLibraryRent-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
