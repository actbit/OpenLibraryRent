name: PR Check

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  dotnet-build:
    name: .NET Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  dotnet-test:
    name: .NET Test
    runs-on: ubuntu-latest
    needs: dotnet-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenLibraryRent.Tests --configuration Release --no-build --verbosity normal

  npm-build:
    name: npm Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OpenLibraryRent/OpenLibraryRent.Client/package-lock.json

      - name: Install dependencies
        working-directory: OpenLibraryRent/OpenLibraryRent.Client
        run: npm ci

      - name: Build
        working-directory: OpenLibraryRent/OpenLibraryRent.Client
        run: npm run build

  npm-check:
    name: npm Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OpenLibraryRent/OpenLibraryRent.Client/package-lock.json

      - name: Install dependencies
        working-directory: OpenLibraryRent/OpenLibraryRent.Client
        run: npm ci

      - name: Svelte Check
        working-directory: OpenLibraryRent/OpenLibraryRent.Client
        run: npm run check
